<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Đặt lại mật khẩu</title>
    <style>
      body {
        font-family: Arial, Helvetica, sans-serif;
        background: #f5f7fb;
        color: #222;
      }
      .box {
        max-width: 480px;
        margin: 60px auto;
        padding: 24px;
        background: #fff;
        border-radius: 8px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
      }
      h2 {
        color: #1a73e8;
        margin-top: 0;
      }
      input {
        width: 100%;
        padding: 10px;
        margin: 8px 0;
        border: 1px solid #ddd;
        border-radius: 4px;
      }
      button {
        background: #1a73e8;
        color: #fff;
        padding: 10px 14px;
        border: none;
        border-radius: 6px;
        cursor: pointer;
      }
      .msg {
        margin: 12px 0;
        color: #c00;
      }
      .success {
        color: green;
      }
    </style>
  </head>
  <body>
    <div class="box">
      <h2>Đặt lại mật khẩu</h2>
      <div id="msg" class="msg"></div>
      <form id="resetForm">
        <label for="newpassword">Mật khẩu mới</label>
        <input
          id="newpassword"
          name="newpassword"
          type="password"
          placeholder="Nhập mật khẩu mới"
          required
          minlength="6"
        />
        <button type="submit">Đổi mật khẩu</button>
      </form>
      <p style="margin-top: 12px; font-size: 13px; color: #666">
        Sau khi thay đổi thành công, bạn có thể đăng nhập với mật khẩu mới.
      </p>
    </div>
    <script src="/templates/reset-password.js"></script>
  </body>
</html>
